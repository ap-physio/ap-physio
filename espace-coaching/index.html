<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon espace coaching — AP Physio</title>
<meta name="description" content="Espace coaching des patients d'Aurèle Pouchelet, physiothérapeute : séances d'exercices, vidéos et exercices de respiration.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121211">
<link rel="manifest" href="/manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="icon" type="image/png" href="/assets/favicon-coaching.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon coaching">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
</head>
<body>
<style>
/* Layout: coque d'appli avec en-tête; patient = calendrier puis fiche de séance, mode séance plein écran (vidéo moitié haute, contrôles en bas); admin = onglets Séances / Exercices et éditeur en deux zones (choix, réglages). */
:root{
  --bg:#F2F3F1;
  --surface:#FFFFFF;
  --fg:#1A1A1A;
  --muted:#5E5C56;
  --line:#DAD8D0;
  --ring:#B3AFA3;
  --accent:#C9A45C;
  --on-accent:#1A1A1A;
  --accent-ink:#8A6A2B;
  --soft:rgba(201,164,92,.16);
  --danger:#A3261E;
  --video-bg:#121211;
  --video-fg:#E8E6DF;
  --orb-hi:rgba(201,164,92,.38);--orb-lo:rgba(201,164,92,.14);--glow:rgba(201,164,92,.22);
  --font-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --font-body:'Jost','Avenir Next','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121211;
    --surface:#1C1C1A;
    --fg:#F2F3F1;
    --muted:#A9A69D;
    --line:#35342F;
    --ring:#5A584F;
    --accent:#C9A45C;
    --on-accent:#1A1A1A;
    --accent-ink:#DDBA74;
    --soft:rgba(201,164,92,.18);
    --danger:#FF8F84;
    --video-bg:#0A0A09;
    --video-fg:#E8E6DF;
    --orb-hi:rgba(201,164,92,.40);--orb-lo:rgba(201,164,92,.14);--glow:rgba(201,164,92,.24);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121211;
  --surface:#1C1C1A;
  --fg:#F2F3F1;
  --muted:#A9A69D;
  --line:#35342F;
  --ring:#5A584F;
  --accent:#C9A45C;
  --on-accent:#1A1A1A;
  --accent-ink:#DDBA74;
  --soft:rgba(201,164,92,.18);
  --danger:#FF8F84;
  --video-bg:#0A0A09;
  --video-fg:#E8E6DF;
  --orb-hi:rgba(201,164,92,.40);--orb-lo:rgba(201,164,92,.14);--glow:rgba(201,164,92,.24);
  color-scheme:dark;
}
*{box-sizing:border-box}
footer.legal{margin:32px auto 0;max-width:1000px;text-align:center;font-size:.85rem;color:var(--muted)}
footer.legal a{color:inherit}
body{font-variant-numeric:lining-nums}
h1,h2,h3{text-wrap:balance}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:400 16px/1.5 var(--font-body);
  padding-block:20px 72px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button,input,select,textarea{font-family:inherit}
h1,h2,h3,p,ol{margin:0}
ol{padding:0;list-style:none}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font:500 .72rem/1 var(--font-body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.meta{color:var(--muted);font-size:.875rem}
.err{color:var(--danger);font-size:.9rem;font-weight:500}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 20px}
.top.narrow{max-width:560px}
.top.wide{max-width:1000px}
.brand{color:inherit;text-decoration:none;display:flex;align-items:center;gap:10px;font:600 1.25rem var(--font-display);letter-spacing:.02em}
.mark{display:grid;place-items:center;width:34px;height:38px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--accent);color:var(--on-accent);font:700 .95rem var(--font-display);letter-spacing:.02em}
.who{display:flex;align-items:center;gap:10px;min-width:0;font-size:.9rem;color:var(--muted)}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.app{margin:0 auto;display:grid;gap:16px;align-content:start}
.app.narrow{max-width:560px}
.app.wide{max-width:1000px}

/* Boutons et champs */
.btn{
  letter-spacing:.04em;appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 18px;
  border:1.5px solid var(--accent);border-radius:3px;
  background:var(--accent);color:var(--on-accent);
  font:600 1rem var(--font-body);text-align:center;cursor:pointer;
}
.btn.sec{background:transparent;color:var(--accent-ink)}
.btn.small{min-height:40px;padding:0 14px;font-size:.9rem}
.btn.big{min-height:56px;font-size:1.05rem}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.danger.on{background:var(--danger);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:active{transform:translateY(1px)}
@media (hover:hover){.btn:hover{filter:brightness(1.08)}}
.ghost{
  appearance:none;min-height:40px;padding:8px 14px;
  border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--fg);
  font:500 .9rem var(--font-body);cursor:pointer;
}
.icon{
  appearance:none;display:grid;place-items:center;width:40px;height:40px;
  border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--fg);
  font-size:1.1rem;cursor:pointer;
}
.icon[disabled]{opacity:.35;cursor:default}
.btn:focus-visible,.ghost:focus-visible,.icon:focus-visible,.chip:focus-visible,.tab:focus-visible,.cell:focus-visible,.pick:focus-visible,.segb:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.vfile:focus-visible + label{outline:3px solid var(--accent);outline-offset:2px}

.field{display:grid;gap:6px;font:500 .85rem var(--font-body);color:var(--muted)}
input,select,textarea{
  width:100%;min-height:44px;padding:8px 12px;
  border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--fg);
  font:400 1rem var(--font-body);
}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input{flex:1;min-width:150px}

/* Connexion */
.login{max-width:420px;margin:6vh auto 0;display:grid;gap:16px}
.login h1{font:600 clamp(2.4rem,11vw,3.2rem)/1.02 var(--font-display);letter-spacing:0}
.lede{max-width:34ch}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--surface)}
.segb{appearance:none;border:0;background:transparent;color:var(--muted);min-height:44px;font:600 .95rem var(--font-body);cursor:pointer}
.segb.on{background:var(--accent);color:var(--on-accent)}
.lform{display:grid;gap:12px}

/* Patient */
.hello{font:700 clamp(1.8rem,8vw,2.4rem)/1.05 var(--font-display);letter-spacing:-.01em}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:14px;display:grid;gap:8px}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-title{font:700 1.4rem var(--font-display)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;padding:4px 0;color:var(--muted);font:600 .75rem var(--font-body)}
.cell{position:relative;display:grid;place-items:center;aspect-ratio:1/1;border:1px solid transparent;border-radius:3px;background:transparent;color:var(--fg);font:500 .95rem var(--font-body)}
button.cell{cursor:pointer}
.cell.today{border-color:var(--fg)}
.cell.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cell .dot{position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.cell.sel .dot{background:var(--on-accent)}
.cell.done .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent)}
.cell.sel.done .dot{box-shadow:inset 0 0 0 1.5px var(--on-accent)}
.legend{display:flex;gap:16px;align-items:center;color:var(--muted);font-size:.8rem}
.legend i{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:var(--accent)}
.legend i.ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent)}
.day{display:grid;gap:12px}
.day h2{font:700 1.6rem var(--font-display)}
.sheet{display:grid;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:3px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet h3{font:700 1.5rem/1.1 var(--font-display)}
.meta strong{color:var(--fg)}
.tag{padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--accent-ink);font:600 .78rem var(--font-body);white-space:nowrap}
.exlist{display:grid;gap:0;counter-reset:ex}
.exlist li{counter-increment:ex;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.exlist li::before{content:counter(ex);grid-row:span 2;font:700 1.2rem var(--font-display);color:var(--accent-ink);min-width:1.2ch}
.exn{font-weight:600}
.exm{color:var(--muted);font-size:.875rem}

/* Admin */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{appearance:none;padding:10px 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font:600 1rem var(--font-body);cursor:pointer}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar h2{font:700 1.65rem var(--font-display)}
.pcard,.panel,.excard{display:grid;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:3px;align-content:start}
.p-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.prow{appearance:none;width:100%;display:grid;
  grid-template-columns:auto 1fr auto;align-items:center;
  gap:2px 12px;padding:14px 16px;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:3px;color:var(--fg)}
/* Pastille : verte si une séance est programmée, rouge sinon.
   L'état est aussi écrit en toutes lettres, la couleur seule ne suffit pas. */
.pr-dot{grid-column:1;grid-row:1 / span 3;width:11px;height:11px;border-radius:50%}
.pr-dot.ok{background:#1E8A5F}
.pr-dot.no{background:#C0392B}
.pr-name{grid-column:2;font:700 1.2rem/1.2 var(--font-display)}
.pr-mail{grid-column:2;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.pr-state{grid-column:2;color:var(--muted);font-size:.85rem}
.pr-go{grid-column:3;grid-row:1 / span 3;font-size:1.5rem;color:var(--accent-ink);line-height:1}
@media (hover:hover){.prow:hover{border-color:var(--accent)}}
.prow:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.back{appearance:none;justify-self:start;padding:8px 0;border:0;background:transparent;
  color:var(--accent-ink);font:500 .95rem var(--font-body);cursor:pointer}
.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pcard h3,.panel h3,.excard h3{font:700 1.35rem/1.15 var(--font-display)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.s-main{display:grid;gap:2px;min-width:0}
.s-title{font-weight:600}
.s-act{display:flex;gap:8px;flex-wrap:wrap}
.tagchip{cursor:default;background:var(--soft);border-color:transparent}
.warnline{color:var(--danger);font-size:.875rem;font-weight:500}
.equip{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.eq-title{font:600 .78rem var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cattabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cattab{appearance:none;display:grid;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--fg);font:600 1rem var(--font-body);text-align:left;cursor:pointer}
.cattab small{color:var(--muted);font:400 .8rem var(--font-body)}
.cattab.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cattab.on small{color:var(--on-accent);opacity:.85}
.cattab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.exc-cue{color:var(--muted);font-size:.9rem}
.exc-vid video{width:100%;max-height:200px;border-radius:3px;background:#000}
.vfile{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);font:500 .875rem var(--font-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dchip{cursor:default;background:var(--soft);border-color:transparent;padding-right:4px}
.dchip button{appearance:none;display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:inherit;cursor:pointer;font-size:.9rem}
.picks{display:grid;gap:8px}
.pick{appearance:none;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.pn{flex:1;min-width:0}
.pn b{display:block;font-weight:600}
.pn small{color:var(--muted)}
.st{color:var(--accent-ink);font-weight:600;font-size:.9rem;white-space:nowrap}
.item{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.item-top{display:flex;align-items:center;gap:8px}
.item-top .n{min-width:1.4ch;font:700 1.3rem var(--font-display);color:var(--accent-ink)}
.item-top .nm{flex:1;min-width:0;font-weight:600}
.stick{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));background:var(--surface);border:1px solid var(--line);border-radius:3px}
.stick .lab{display:block;color:var(--muted);font-size:.8rem}
.stick strong{font:700 1.45rem var(--font-display)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:50;max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:.9rem;font-weight:500}

/* Mode séance */
.runner{
  position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
  background:var(--bg);
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  overscroll-behavior:contain;
}
.r-inner{width:100%;max-width:720px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column}
.r-top{flex:none;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px 12px;padding:10px 0}
.r-count{text-align:right;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.r-bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.r-bar div{height:100%;background:var(--accent)}
.r-video{flex:0 0 46%;min-height:0;position:relative;overflow:hidden;border-radius:12px;background:var(--video-bg)}
.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.vph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;color:var(--video-fg);text-align:center}
.vph-tag{font:600 .72rem var(--font-body);letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.vph-name{font:700 clamp(1.1rem,5vw,1.5rem)/1.15 var(--font-display)}
.vph-play{position:relative;width:46px;height:46px;border:2px solid currentColor;border-radius:50%;opacity:.8}
.vph-play::after{content:"";position:absolute;left:50%;top:50%;margin:-8px 0 0 -4px;border-left:14px solid currentColor;border-top:8px solid transparent;border-bottom:8px solid transparent}
.r-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:12px 0;text-align:center}
.r-kicker{font:600 .75rem/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.r-name{font:700 clamp(1.4rem,6vw,1.9rem)/1.1 var(--font-display);text-wrap:balance}
.r-set{font-size:1.05rem}
.r-cue{max-width:46ch;margin:0 auto;color:var(--muted);font-size:.95rem}
.r-big{font:700 clamp(4rem,22vw,6rem)/1 var(--font-display);font-variant-numeric:tabular-nums}
.r-foot{flex:none;display:grid;gap:8px;padding:12px 0 16px}
.r-finish{justify-content:center;align-items:center;text-align:center;gap:14px}
.r-finish .btn{width:min(100%,360px)}

.note{max-width:60ch;margin-top:8px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.875rem}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:8px 14px 8px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);font:500 .9rem var(--font-body);cursor:pointer}
.sw .dot{position:relative;width:28px;height:16px;border-radius:999px;background:var(--ring);transition:background .2s}
.sw .dot::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);transition:transform .2s}
.sw[aria-checked="true"] .dot{background:var(--accent)}
.sw[aria-checked="true"] .dot::after{transform:translateX(12px)}
.blist{display:grid;gap:12px}
.bcard-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.bnum{min-width:1.1ch;font:600 2.2rem/1 var(--font-body);color:var(--accent-ink);font-variant-numeric:tabular-nums}
.bproto{max-width:60ch;font-size:.95rem}
.pips{display:flex;gap:3px;align-items:flex-end}
.pips i{display:block;width:6px;border-radius:2px;background:var(--line)}
.pips i:nth-child(1){height:9px}
.pips i:nth-child(2){height:14px}
.pips i:nth-child(3){height:19px}
.pips i.on{background:var(--accent)}
.btn.play::before{content:"";border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.sw:focus-visible,.b-pause:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.b-run{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));overscroll-behavior:contain}

<script>
(function(){
'use strict';

//<logic>
function exTime(ex,it){var w=ex.unit==='sec'?it.value:it.value*(ex.tempo||4);return it.sets*w+Math.max(0,it.sets-1)*it.rest;}
function sessTimeWith(s,getEx){var t=0;s.items.forEach(function(it){t+=exTime(getEx(it.exId),it);});return t+Math.max(0,s.items.length-1)*s.exRest;}
function fmtDur(sec){if(sec<60)return sec+' s';return Math.round(sec/60)+' min';}
//</logic>

var KEY='ap-seances-proto-v1';
var CATS=['Membre supérieur','Membre inférieur','Mobilité / stretching','Tronc'];
var EQUIP=['Élastiques','Haltères','Kettlebell','Tapis','Banc','Barre de traction','Swiss ball','Rouleau de massage'];
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function num(v,min,max){var n=parseInt(v,10);if(isNaN(n))n=min;return Math.min(max,Math.max(min,n));}
function plural(n,w){return n+' '+w+(n>1?'s':'');}
var fmtLong=new Intl.DateTimeFormat('fr-CH',{weekday:'long',day:'numeric',month:'long'});
var fmtMonth=new Intl.DateTimeFormat('fr-CH',{month:'long',year:'numeric'});
var fmtShort=new Intl.DateTimeFormat('fr-CH',{weekday:'short',day:'numeric',month:'short'});
var todayIso=iso(new Date());
var SB_URL = 'https://yqnoencfedoxgzrgpmbf.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlxbm9lbmNmZWRveGd6cmdwbWJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMzk3MTYsImV4cCI6MjEwODYxNTcxNn0.hEuAqIalEbtTBBbyM0xo3OHphL4h8s-CWD9GETKTR0E';
if(!window.supabase || !window.supabase.createClient){

var db = {auth:null, patients:[], exercises:[], sessions:[], done:{}};
var videos = {};

/* Les écritures partent vers Supabase au moment de chaque action :
   save() ne sert plus qu'à garder les anciens appels sans effet. */

function oops(e, quoi){
  console.error(quoi, e);

/* ---------- Lecture ---------- */
function toPatient(r){
  var n = ((r.prenom||'') + ' ' + (r.nom||'')).trim();
  return {id:r.id, name:n||'Patient', email:r.email||'', equipment:r.materiel||[], role:r.role};
}
function toExercise(r){
  return {id:r.id, name:r.nom, cat:r.categorie, unit:r.unite==='sec'?'sec':'reps',
          tempo:r.tempo||4, cue:r.consigne||'', equip:r.materiel||[], video:r.video||null};
}

function loadAll(){
  return Promise.all([
    sb.from('profils').select('*').order('prenom'),
    sb.from('exercices').select('*').order('nom'),
    sb.from('seances').select('*').order('cree_le'),
    sb.from('seance_exercices').select('*').order('position'),
    sb.from('seance_dates').select('*')
  ]).then(function(r){
    r.forEach(function(x){ if(x.error) throw x.error; });
    // L'administrateur ne figure pas dans sa propre liste de patients.
    db.patients  = r[0].data.filter(function(x){return x.role !== 'admin';}).map(toPatient);
    db.moi       = (r[0].data.filter(function(x){return x.role === 'admin';})[0] || null);
    db.exercises = r[1].data.map(toExercise);
    var byId = {};
    db.sessions = r[2].data.map(function(x){
      var o = {id:x.id, patientId:x.patient_id, title:x.titre, note:x.note||'',
               exRest:x.repos_exercice, dates:[], items:[]};
      byId[x.id] = o; return o;
    });
    r[3].data.forEach(function(it){
      var o = byId[it.seance_id];
      if(o) o.items.push({exId:it.exercice_id, sets:it.series, value:it.valeur, rest:it.repos});
    });
    db.done = {};
    r[4].data.forEach(function(d){
      var o = byId[d.seance_id];
      if(!o) return;
      if(o.dates.indexOf(d.jour) < 0) o.dates.push(d.jour);
      if(d.faite) db.done[d.seance_id + '|' + d.jour] = true;
    });
    db.sessions.forEach(function(o){ o.dates.sort(); });
    return loadVideos();
  });
}

/* Les vidéos sont dans un dossier privé : il faut une adresse signée,
   valable deux heures, pour les lire. */
function loadVideos(){
  var paths = db.exercises.filter(function(e){return e.video;}).map(function(e){return e.video;});
  if(!paths.length) return Promise.resolve();
  return sb.storage.from('videos').createSignedUrls(paths, 7200).then(function(r){
    if(r.error) return;
    (r.data||[]).forEach(function(x){
      var ex = db.exercises.filter(function(e){return e.video === x.path;})[0];
      if(ex && x.signedUrl) videos[ex.id] = x.signedUrl;
    });
  }).catch(function(){});
}

/* ---------- Écriture ---------- */
function sbPatientEquip(p){
  sb.from('profils').update({materiel:p.equipment}).eq('id', p.id)
    .then(function(r){ if(r.error) oops(r.error, 'Le matériel'); });
}
function sbExerciceEquip(ex){
  sb.from('exercices').update({materiel:ex.equip}).eq('id', ex.id)
    .then(function(r){ if(r.error) oops(r.error, 'Le matériel'); });
}
function sbSetDone(sid, jour){
  sb.from('seance_dates').update({faite:true}).eq('seance_id', sid).eq('jour', jour)
    .then(function(r){ if(r.error) oops(r.error, 'La séance faite'); });
}
function sbDeleteSession(sid){
  return sb.from('seances').delete().eq('id', sid).then(function(r){
    if(r.error) throw r.error;
  });
}
function sbSaveSession(s){
  var row = {patient_id:s.patientId, titre:s.title, repos_exercice:s.exRest};
  var q = s.id
    ? sb.from('seances').update(row).eq('id', s.id).select('id').single()
    : sb.from('seances').insert(row).select('id').single();
  return q.then(function(r){
    if(r.error) throw r.error;
    var id = r.data.id;
    s.id = id;
    return sb.from('seance_exercices').delete().eq('seance_id', id).then(function(){
      return sb.from('seance_exercices').insert(s.items.map(function(it, i){
        return {seance_id:id, exercice_id:it.exId, position:i,
                series:it.sets, valeur:it.value, repos:it.rest};
      }));
    }).then(function(){
      return sb.from('seance_dates').delete().eq('seance_id', id).eq('faite', false);
    }).then(function(){
      return sb.from('seance_dates').upsert(
        s.dates.map(function(j){ return {seance_id:id, jour:j}; }),
        {onConflict:'seance_id,jour', ignoreDuplicates:true}
      );
    }).then(function(r2){
      if(r2 && r2.error) throw r2.error;
      return id;
    });
  });
}
function sbCreateExercise(ex){
  return sb.from('exercices').insert({
    nom:ex.name, categorie:ex.cat, unite:ex.unit, tempo:ex.tempo,
    consigne:ex.cue, materiel:ex.equip
  }).select('*').single().then(function(r){
    if(r.error) throw r.error;
    return toExercise(r.data);
  });
}
function sbUploadVideo(exId, file){
  var ex = findEx(exId);
  if(!ex) return Promise.reject(new Error('exercice inconnu'));
  var m = (file.name.match(/\.([a-z0-9]+)$/i) || [null,'mp4'])[1].toLowerCase();
  var path = exId + '.' + m;
  return sb.storage.from('videos').upload(path, file, {upsert:true, contentType:file.type})
    .then(function(r){
      if(r.error) throw r.error;
      return sb.from('exercices').update({video:path}).eq('id', exId);
    })
    .then(function(r){
      if(r.error) throw r.error;
      ex.video = path;
      return sb.storage.from('videos').createSignedUrl(path, 7200);
    })
    .then(function(r){
      if(r.data && r.data.signedUrl) videos[exId] = r.data.signedUrl;
    });
}

var ui={pview:'seances',pid:null,exCat:CATS[0],sel:todayIso,cal:firstOfMonth(new Date()),aview:'sessions',edit:null,cat:'Tous',newDate:todayIso,err:'',edErr:'',lf:{},confirmDel:null,loginTab:'in'};
var $app=document.getElementById('app'),$run=document.getElementById('runner'),$toast=document.getElementById('toast');

function EX(id){
  for(var i=0;i<db.exercises.length;i++)if(db.exercises[i].id===id)return db.exercises[i];
  return {id:id,name:'Exercice supprimé',cat:'',unit:'reps',tempo:4,cue:''};
}
function sessTime(s){return sessTimeWith(s,EX);}
function sessEquip(s){
  var out=[],low=[];
  s.items.forEach(function(it){
    (EX(it.exId).equip||[]).forEach(function(x){if(low.indexOf(x.toLowerCase())<0){low.push(x.toLowerCase());out.push(x);}});
  });
  return out;
}
function patient(){
  if(!db.auth)return null;
  for(var i=0;i<db.patients.length;i++)if(db.patients[i].id===db.auth.patientId)return db.patients[i];
  return null;
}
function sessionsOn(pid,d){return db.sessions.filter(function(s){return s.patientId===pid&&s.dates.indexOf(d)>-1;});}
function isDone(s,d){return !!db.done[s.id+'|'+d];}

var tt=0;
function toast(m){$toast.textContent=m;$toast.hidden=false;clearTimeout(tt);tt=setTimeout(function(){$toast.hidden=true;},2400);}

function calendarHtml(pid){
  var m=ui.cal,y=m.getFullYear(),mo=m.getMonth();
  var lead=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate(),i,cells='';
  ['L','M','M','J','V','S','D'].forEach(function(l){cells+='<span class="dow" aria-hidden="true">'+l+'</span>';});
  for(i=0;i<lead;i++)cells+='<span class="cell" aria-hidden="true"></span>';
  for(i=1;i<=days;i++){
    var dt=new Date(y,mo,i),d=iso(dt),ss=sessionsOn(pid,d);
    var all=ss.length>0&&ss.every(function(s){return isDone(s,d);});
    var cls='cell'+(d===todayIso?' today':'')+(d===ui.sel?' sel':'')+(all?' done':'');
    cells+='<button type="button" class="'+cls+'" data-a="day" data-d="'+d+'" aria-pressed="'+(d===ui.sel)+'" aria-label="'+esc(fmtLong.format(dt)+(ss.length?', '+plural(ss.length,'séance'):''))+'">'+i+(ss.length?'<i class="dot"></i>':'')+'</button>';
  }
  return '<section class="cal" aria-label="Calendrier"><div class="cal-head">'+
    '<button class="icon" type="button" data-a="cal-prev" aria-label="Mois précédent">‹</button>'+
    '<h2 class="cal-title">'+esc(cap(fmtMonth.format(m)))+'</h2>'+
    '<button class="icon" type="button" data-a="cal-next" aria-label="Mois suivant">›</button></div>'+
    '<div class="cal-grid">'+cells+'</div>'+
    '<p class="legend"><span><i></i>À faire</span><span><i class="ring"></i>Terminée</span></p></section>';
}
function dayHtml(pid){
  var d=ui.sel,ss=sessionsOn(pid,d);
  var any=db.sessions.some(function(s){return s.patientId===pid;});
  var h='<section class="day"><h2>'+esc(cap(fmtLong.format(parse(d))))+'</h2>';
  if(!ss.length)h+='<p class="muted">'+(any?'Pas de séance prévue ce jour.':'Aurèle n’a pas encore préparé de séance pour toi.')+'</p>';
  ss.forEach(function(s){
    var done=isDone(s,d);
    h+='<article class="sheet"><div class="sheet-top"><h3>'+esc(s.title)+'</h3>'+(done?'<span class="tag">Terminée</span>':'')+'</div>'+
      '<p class="meta"><strong>≈ '+fmtDur(sessTime(s))+'</strong> · '+plural(s.items.length,'exercice')+'</p>'+prepHtml(s)+
      '<ol class="exlist">'+s.items.map(function(it){
        var ex=EX(it.exId);
        return '<li><span class="exn">'+esc(ex.name)+'</span><span class="exm">'+it.sets+' × '+it.value+(ex.unit==='sec'?' s':'')+' · repos '+it.rest+' s</span></li>';
      }).join('')+'</ol>'+
      '<button class="btn" type="button" data-a="start" data-s="'+s.id+'">'+(done?'Refaire la séance':'Commencer la séance')+'</button></article>';
  });
  return h+'</section>';
}

/* ---------- Actions ---------- */
function apresConnexion(user){
  return loadAll().then(function(){
    var estAdmin = !!(db.moi && db.moi.id === user.id);
    db.auth = {userId:user.id, patientId:user.id, role:estAdmin ? 'admin' : 'patient'};
    ui.sel=todayIso;ui.cal=firstOfMonth(new Date());ui.aview='sessions';ui.pview='seances';
    ui.edit=null;ui.err='';ui.lf={};
    nav();
  });
}
function messageAuth(e){
  var m = (e && e.message) || '';
  if(/Invalid login/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  if(/already registered/i.test(m)) return 'Cet e-mail a déjà un compte. Connecte-toi.';
  if(/Email not confirmed/i.test(m)) return 'Ouvre l’e-mail de confirmation avant de te connecter.';
  if(/Password should be/i.test(m)) return 'Choisis un mot de passe d’au moins 6 caractères.';
  if(/rate limit|too many/i.test(m)) return 'Trop de tentatives. Réessaie dans quelques minutes.';
  return m || 'La connexion a échoué. Réessaie.';
}
function busy(on){
  var b = $app.querySelector('form[data-form] button[type="submit"]');
  if(b){ b.disabled = on; if(on) b.textContent = 'Un instant…'; }
}
function findEx(id){
  for(var i=0;i<db.exercises.length;i++)if(db.exercises[i].id===id)return db.exercises[i];
  return null;
}
function toggleExEquip(id,v){
  var ex=findEx(id),i=-1;
  if(!ex)return;
  ex.equip=ex.equip||[];
  ex.equip.forEach(function(y,k){if(y.toLowerCase()===String(v).toLowerCase())i=k;});
  if(i>-1)ex.equip.splice(i,1);else ex.equip.push(v);
  sbExerciceEquip(ex);render();
}
function addExEquip(id,v){
  var ex=findEx(id);v=String(v||'').trim();
  if(!ex||!v)return;
  ex.equip=ex.equip||[];
  if(ex.equip.some(function(y){return y.toLowerCase()===v.toLowerCase();}))return;
  ex.equip.push(v);sbExerciceEquip(ex);render();
}
function getPatient(id){
  for(var i=0;i<db.patients.length;i++)if(db.patients[i].id===id)return db.patients[i];
  return null;
}
function addEquip(pid,v){
  var p=getPatient(pid);v=String(v||'').trim();
  if(!p||!v)return;
  p.equipment=p.equipment||[];
  if(p.equipment.some(function(x){return x.toLowerCase()===v.toLowerCase();}))return;
  p.equipment.push(v);sbPatientEquip(p);render();
}
function removeEquip(pid,i){
  var p=getPatient(pid);
  if(!p||!p.equipment)return;
  p.equipment.splice(i,1);sbPatientEquip(p);render();
}
function openEditor(sid,pid){
  var s=null,i;
  if(sid)for(i=0;i<db.sessions.length;i++)if(db.sessions[i].id===sid)s=db.sessions[i];
  ui.edit=s?JSON.parse(JSON.stringify(s)):{id:null,patientId:pid||(db.patients[0]?db.patients[0].id:''),title:'',dates:[],exRest:30,items:[]};
  ui.aview='edit';ui.cat='Tous';ui.newDate=todayIso;ui.edErr='';nav();
}
function toggleEx(id){
  var a=ui.edit.items,i,idx=-1;
  for(i=0;i<a.length;i++)if(a[i].exId===id)idx=i;
  if(idx>-1)a.splice(idx,1);
  else a.push({exId:id,sets:3,value:EX(id).unit==='sec'?30:12,rest:45});
}
function move(i,dir){
  var a=ui.edit.items,j=i+dir,t;
  if(j<0||j>=a.length)return;
  t=a[i];a[i]=a[j];a[j]=t;
}
function addDate(){
  var v=ui.newDate;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ui.edErr='Choisis une date valide.';render();return;}
  if(ui.edit.dates.indexOf(v)<0){ui.edit.dates.push(v);ui.edit.dates.sort();}
  ui.edErr='';render();
}
function saveEdit(){
  var s=ui.edit,i;
  if(!s.patientId){ui.edErr='Choisis un patient.';render();return;}
  if(!s.title.trim()){ui.edErr='Donne un titre à la séance.';render();return;}
  if(!s.dates.length){ui.edErr='Ajoute au moins une date.';render();return;}
  if(!s.items.length){ui.edErr='Choisis au moins un exercice.';render();return;}
  s.title=s.title.trim();
  ui.edErr='Enregistrement…';render();
  sbSaveSession(s).then(function(){
    return loadAll();
  }).then(function(){
    ui.aview=ui.pid?'patient':'sessions';ui.edit=null;ui.edErr='';nav();toast('Séance enregistrée');
  }).catch(function(e){
    console.error(e);
    ui.edErr='La séance n’a pas pu être enregistrée. Vérifie ta connexion.';render();
  });
}

$app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');
  if(!b||b.disabled)return;
  var a=b.getAttribute('data-a'),d=b.dataset;
  switch(a){
    case 'tab-login':ui.loginTab=d.t;ui.err='';ui.info='';render();break;
    case 'logout':
      sb.auth.signOut().catch(function(){});
      db.auth=null;db.patients=[];db.sessions=[];db.done={};videos={};
      ui.edit=null;ui.aview='sessions';ui.lf={};ui.err='';nav();break;
    case 'cal-prev':ui.cal=new Date(ui.cal.getFullYear(),ui.cal.getMonth()-1,1);render();break;
    case 'cal-next':ui.cal=new Date(ui.cal.getFullYear(),ui.cal.getMonth()+1,1);render();break;
    case 'day':ui.sel=d.d;render();break;
    case 'start':startRun(d.s,ui.sel);break;
    case 'tab-s':ui.aview='sessions';ui.pid=null;ui.confirmDel=null;nav();break;
    case 'open-p':ui.pid=d.p;ui.aview='patient';ui.confirmDel=null;nav();break;
    case 'ptab-s':ui.pview='seances';render();break;
    case 'ptab-b':ui.pview='breath';render();break;
    case 'btog':bp[d.k]=!bp[d.k];bsave();render();if(d.k==='sound'&&bp.sound){ensureAudio();tone(523,.3,.1);}if(d.k==='vibe'&&bp.vibe)bbuzz(40);break;
    case 'bstart':startBreath(+d.b,b);break;
    case 'xe-toggle':toggleExEquip(d.e,d.v);break;
    case 'eq-add':addEquip(d.p,d.v);break;
    case 'eq-rm':removeEquip(d.p,+d.i);break;
    case 'ex-cat':ui.exCat=d.c;render();break;
    case 'tab-e':ui.aview='exercises';ui.pid=null;ui.exErr='';nav();break;
    case 'tab-b':ui.aview='breath';ui.pid=null;nav();break;
    case 'new':openEditor(null,d.p);break;
    case 'edit':openEditor(d.s);break;
    case 'del':
      if(ui.confirmDel===d.s){
        var sid=d.s;
        db.sessions=db.sessions.filter(function(s){return s.id!==sid;});
        ui.confirmDel=null;
        sbDeleteSession(sid).then(function(){toast('Séance supprimée');})
          .catch(function(e){oops(e,'La suppression');loadAll().then(render);});
      }
      else ui.confirmDel=d.s;
      render();break;
    case 'ed-back':ui.aview=ui.pid?'patient':'sessions';ui.edit=null;nav();break;
    case 'ed-cat':ui.cat=d.c;render();break;
    case 'ed-toggle':toggleEx(d.e);ui.edErr='';render();break;
    case 'ed-up':move(+d.i,-1);render();break;
    case 'ed-down':move(+d.i,1);render();break;
    case 'ed-rm':ui.edit.items.splice(+d.i,1);render();break;
    case 'ed-adddate':addDate();break;
    case 'ed-rmdate':ui.edit.dates=ui.edit.dates.filter(function(x){return x!==d.d;});render();break;
    case 'ed-save':saveEdit();break;
  }
});

function onField(el){
  var f=el.getAttribute&&el.getAttribute('data-f');
  if(el.form&&el.name&&el.name!=='password'){
    var fk=el.form.getAttribute('data-form');
    if(fk==='login'||fk==='signup')ui.lf[el.name]=el.value;
  }
  if(!f||!ui.edit)return;
  var i=el.getAttribute('data-i');
  if(f==='title')ui.edit.title=el.value;
  else if(f==='patient'){ui.edit.patientId=el.value;render();return;}
  else if(f==='newdate')ui.newDate=el.value;
  else if(f==='exRest')ui.edit.exRest=num(el.value,0,600);
  else if(i!==null&&ui.edit.items[+i]){

/* ---------- Mode séance ---------- */
var R=null,rt=0,wake=null,actx=null;
function cur(){for(var i=0;i<db.sessions.length;i++)if(db.sessions[i].id===R.sid)return db.sessions[i];return null;}
function ensureAudio(){
  try{
    if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C();}
    if(actx&&actx.state==='suspended')actx.resume();
  }catch(e){}
}
function tone(f,d,v,delay){
  if(!actx||!bp.sound)return;
  try{
    var t0=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(v,t0+.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+d+.05);
  }catch(e){}
}
function beep(){tone(880,.12,.12);tone(880,.12,.12,.2);}
function endBeep(){[523,659,784].forEach(function(f,i){tone(f,.7,.14,i*.28);});}
function requestWake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wake=l;}).catch(function(){});}catch(e){}}
function releaseWake(){try{if(wake)wake.release();}catch(e){}wake=null;}
function setText(id,v){var el=document.getElementById(id);if(el)el.textContent=v;}

function videoHtml(ex){
  var u=videos[ex.id];
  if(u)return '<video class="vid" src="'+u+'" autoplay muted loop playsinline controls></video>';
  return '<div class="vph"><span class="vph-tag">Ta vidéo ici</span><span class="vph-name">'+esc(ex.name)+'</span><span class="vph-play" aria-hidden="true"></span></div>';
}
function runnerHtml(){
  var s=cur(),n=s.items.length;
  if(R.finished){
    var mins=Math.max(1,Math.round((Date.now()-R.t0)/60000));
    return '<div class="r-inner r-finish"><p class="r-kicker">Bravo</p><h2 class="r-name">Séance terminée</h2>'+
      '<p class="r-set">'+plural(n,'exercice')+' · '+mins+' min</p>'+
      '<button class="btn big" type="button" data-r="close">Retour au calendrier</button></div>';
  }
  var it=s.items[R.i],ex=EX(it.exId),rest=R.phase==='rest',exRest=rest&&R.restKind==='ex';
  var showIdx=exRest?R.i+1:R.i,showEx=exRest?EX(s.items[R.i+1].exId):ex;
  var done=rest?(exRest?R.i+1:R.i+(R.set+1)/it.sets):R.i+R.set/it.sets;
  var pct=Math.round(done/n*100);
  var h='<div class="r-inner"><div class="r-top"><button class="ghost" type="button" data-r="quit">Quitter</button>'+
    '<p class="r-count">Exercice '+(showIdx+1)+' sur '+n+'</p><div class="r-bar"><div style="width:'+pct+'%"></div></div></div>';
  h+='<div class="r-video">'+videoHtml(showEx)+'</div><div class="r-body">';
  if(rest){
    var next=exRest?'Prochain exercice : <strong>'+esc(showEx.name)+'</strong>':'Prochaine : série '+(R.set+2)+' sur '+it.sets;
    h+='<p class="r-kicker">Repos</p><p class="r-big" id="rnum">'+R.restLeft+'</p><p class="r-set">'+next+'</p></div>'+
      '<div class="r-foot"><button class="btn big" type="button" data-r="skip">Passer le repos</button>'+
      '<button class="btn sec" type="button" data-r="plus">+ 10 s</button></div></div>';
    return h;
  }
  var unit=ex.unit==='sec'?it.value+' secondes':it.value+' répétitions';
  h+='<h2 class="r-name">'+esc(ex.name)+'</h2><p class="r-set">Série '+(R.set+1)+' sur '+it.sets+' · <strong>'+unit+'</strong></p>';
  if(R.holdEnd)h+='<p class="r-big" id="rnum">'+R.holdLeft+'</p>';
  else if(ex.cue)h+='<p class="r-cue">'+esc(ex.cue)+'</p>';
  var last=R.set===it.sets-1,lastEx=R.i===n-1;
  var label=!last?'Série terminée':(lastEx?'Terminer la séance':'Exercice suivant');
  h+='</div><div class="r-foot"><button class="btn big" type="button" data-r="done">'+label+'</button>'+
    (ex.unit==='sec'&&!R.holdEnd?'<button class="btn sec" type="button" data-r="hold">Lancer le chrono ('+it.value+' s)</button>':'')+'</div></div>';
  return h;
}
function renderRunner(){
  R.quitAsk=false;
  $run.hidden=false;
  $run.innerHTML=runnerHtml();
}
function startRun(sid,date){
  R={sid:sid,date:date,i:0,set:0,phase:'work',restKind:'',restEnd:0,restLeft:0,holdEnd:0,holdLeft:0,t0:Date.now(),finished:false,quitAsk:false};
  ensureAudio();requestWake();
  document.body.style.overflow='hidden';
  renderRunner();
  clearInterval(rt);rt=setInterval(rtick,200);
}
function advance(kind){
  if(kind==='set')R.set++;else{R.i++;R.set=0;}
  R.phase='work';R.holdEnd=0;renderRunner();
}
function startRest(sec,kind){
  if(sec<=0){advance(kind);return;}
  R.phase='rest';R.restKind=kind;R.restEnd=Date.now()+sec*1000;R.restLeft=sec;R.holdEnd=0;
  renderRunner();
}
function setDone(){
  var s=cur(),it=s.items[R.i];
  R.holdEnd=0;
  if(R.set<it.sets-1)startRest(it.rest,'set');
  else if(R.i<s.items.length-1)startRest(s.exRest,'ex');
  else finishRun();
}
function finishRun(){
  R.finished=true;
  db.done[R.sid+'|'+R.date]=true;sbSetDone(R.sid,R.date);
  clearInterval(rt);endBeep();releaseWake();
  renderRunner();
}
function closeRunner(){
  clearInterval(rt);releaseWake();
  $run.hidden=true;$run.innerHTML='';
  document.body.style.overflow='';
  R=null;render();
}
function rtick(){
  if(!R||R.finished)return;
  var now=Date.now();
  if(R.phase==='rest'){
    var left=Math.max(0,Math.ceil((R.restEnd-now)/1000));
    if(left!==R.restLeft){R.restLeft=left;setText('rnum',left);}
    if(now>=R.restEnd){beep();advance(R.restKind);}
  }else if(R.holdEnd){
    var l=Math.max(0,Math.ceil((R.holdEnd-now)/1000));
    if(l!==R.holdLeft){R.holdLeft=l;setText('rnum',l);}
    if(now>=R.holdEnd){R.holdEnd=0;beep();renderRunner();}
  }
}
$run.addEventListener('click',function(e){
  var b=e.target.closest('[data-r]');
  if(!b||!R)return;
  var a=b.getAttribute('data-r');
  if(a==='done')setDone();
  else if(a==='hold'){var it=cur().items[R.i];R.holdEnd=Date.now()+it.value*1000;R.holdLeft=it.value;renderRunner();}
  else if(a==='skip')advance(R.restKind);
  else if(a==='plus'){R.restEnd+=10000;R.restLeft=Math.ceil((R.restEnd-Date.now())/1000);setText('rnum',R.restLeft);}
  else if(a==='quit'){if(R.quitAsk)closeRunner();else{R.quitAsk=true;b.textContent='Quitter la séance ?';}}
  else if(a==='close')closeRunner();
});
document.addEventListener('visibilitychange',function(){if(R&&!R.finished&&document.visibilityState==='visible')requestWake();});

function bchain(ph){
  var i,p,prev;
  for(i=1;i<ph.length;i++){
    p=ph[i];prev=ph[i-1];
    p.a=prev.b;
    if(p.kind==='hold')p.b=p.a;
  }
}
function bcompile(s){
  var ph=s.build(),t=0;
  bchain(ph);
  ph.forEach(function(p){p.s=t;t+=p.d;});

var BLV=['','Douce','Modérée','Intense'];

var $breath=document.getElementById('breath'),$borb=document.getElementById('borb'),$blab=document.getElementById('blab'),$bnum=document.getElementById('bnum'),
    $bsub=document.getElementById('bsub'),$bremain=document.getElementById('bremain'),$bprog=document.getElementById('bprog'),
    $bpause=document.getElementById('bpause'),$btitle=document.getElementById('btitle');
function bset(el,v){if(el._v!==v){el._v=v;el.textContent=v;}}
function bfmt(sec){return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}
function bease(u){return (1-Math.cos(Math.PI*u))/2;}
function bbuzz(v){if(!bp.vibe)return;try{if(navigator.vibrate)navigator.vibrate(v);}catch(e){}}
function bcue(p){
  if(p.silent)return;
  if(p.rapid){if(p.kind==='in'){tone(660,.07,.05);bbuzz(12);}return;}
  if(p.kind==='in'){tone(523,.4,.14);bbuzz(40);}
  else if(p.kind==='out'){tone(392,.4,.14);bbuzz(20);}
  else if(p.kind==='hold'){tone(440,.18,.12);tone(440,.18,.12,.22);bbuzz([30,60,30]);}
  else{tone(330,.5,.1);bbuzz(25);}
}
function bEndCue(){[523,659,784].forEach(function(f,i){tone(f,.7,.14,i*.28);});bbuzz([200,100,200]);}
function bScaleAt(p,el){
  if(p.kind==='free'){
    var k=bease(Math.min(1,el/2));
    return p.a+(p.b-p.a)*k+.035*Math.sin(el*Math.PI*2/4)*k;
  }
  if(p.kind==='hold')return p.a;
  return p.a+(p.b-p.a)*bease(Math.min(1,el/p.d));
}
function bLead(n){
  bset($blab,'Prépare-toi');
  bset($bnum,String(n));
  bset($bsub,'Installe-toi confortablement');
  bset($bremain,bfmt(Math.round(BS.total)));
  $borb.style.transform='scale('+BS.ph[0].a+')';
  $borb.classList.remove('hold');
  $bprog.style.width='0%';
  if(BS.leadN!==n){BS.leadN=n;tone(440,.08,.08);}
}
function bRender(t){
  var p=BS.ph[BS.i],el=t-p.s;
  $borb.style.transform='scale('+bScaleAt(p,el).toFixed(4)+')';
  $borb.classList.toggle('hold',p.kind==='hold');
  bset($blab,p.label);
  bset($bnum,p.n!=null?String(p.n):(p.d>=3?String(Math.max(1,Math.ceil(p.d-el))):''));
  bset($bsub,p.sub||'');
  bset($bremain,bfmt(Math.max(0,Math.ceil(BS.total-t))));
  $bprog.style.width=Math.min(100,t/BS.total*100).toFixed(2)+'%';
}
function btick(){
  if(!BS||BS.done)return;
  var now=performance.now();
  if(BS.paused){BS.last=now;return;}
  BS.e+=(now-BS.last)/1000;BS.last=now;
  if(BS.e<BLEAD){bLead(Math.ceil(BLEAD-BS.e));return;}
  var t=BS.e-BLEAD;
  if(t>=BS.total){bFinish();return;}
  while(BS.i+1<BS.ph.length&&t>=BS.ph[BS.i+1].s)BS.i++;
  if(BS.i!==BS.cued){BS.cued=BS.i;bcue(BS.ph[BS.i]);}
  bRender(t);
}
function bloop(){btick();braf=requestAnimationFrame(bloop);}
function bFinish(){
  BS.done=true;

  bEndCue();releaseWake();
  bset($blab,'Terminé');bset($bnum,'');
  bset($bsub,'Prends un instant avant de te lever.');
  bset($bremain,'0:00');
  $bprog.style.width='100%';
  $borb.style.transform='scale('+BMID+')';
  $borb.classList.remove('hold');
  $bpause.textContent='Fermer';
}
function startBreath(i,btn){

  BS={ph:c.ph,total:c.total,i:-1,cued:-1,e:0,last:performance.now(),paused:false,done:false,leadN:null,btn:btn};
  $btitle.textContent=s.name;

  $bpause.textContent='Pause';
  $breath.hidden=false;
  document.body.style.overflow='hidden';
  requestWake();bLead(BLEAD);
  $bpause.focus();
  clearInterval(btimer);cancelAnimationFrame(braf);
  btimer=setInterval(btick,250);
  braf=requestAnimationFrame(bloop);
}
function closeBreath(){
  clearInterval(btimer);cancelAnimationFrame(braf);

}
